<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Collaboration Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>GitHub Demo</h1>
    <p>This is a simple HTML page for GitHub collaboration practice.</p>
    <h1>Hello Raj here...</h1>
    <h1>Hello Raj here...</h1>
    <h1>Hello Ankita here...</h1>
    <button onclick="showMessage()">Click Me</button>
    <p id="message"></p>
</div>

<div class="card feature-card">
    <h2>Ankita Feature</h2>
    <p>ankitafeatures implemented</p>
</div>

<script>
    function showMessage() {
        document.getElementById("message").innerHTML =
            "Hello! GitHub Collaboration is Working 🚀";
    }
</script>

</body>
</html>
